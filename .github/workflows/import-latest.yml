name: Import Claude's latest Setline release
on:
  push:
    paths: ['.github/workflows/import-latest.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'omaralawi1000-netizen/Setline-Codex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import verified upstream release
        run: |
          set -euo pipefail
          upstream=372f5e564cd4b356b07a92f78e99c720b4325ce6
          git fetch https://github.com/omaralawi1000-netizen/Setline.git "$upstream"
          test "$(git rev-parse FETCH_HEAD)" = "$upstream"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "$upstream"
          node --test
          git push origin HEAD:main
